name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wii U libraries
        run: dkp-pacman -Syu --noconfirm --needed wut wut-tools wiiu-curl wiiu-sdl2 wiiu-sdl2_ttf wiiu-sdl2_mixer wiiu-sdl2_image
      - name: Build
        run: make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: wiidrop
          path: |
            wiidrop.wuhb
            wiidrop.rpx
