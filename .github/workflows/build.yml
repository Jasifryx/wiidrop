name: Build

on:
  push:
    # README, screenshots, issue forms and the PC tools don't change the app: no build for those
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', 'tools/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', 'tools/**', 'LICENSE']
  workflow_dispatch:

# a newer push makes an older, still-running build pointless
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LIBMOCHA_COMMIT: 50fefdf8307a875c63bdbdcf6c973779d4ddac92

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wii U libraries
        # The devkitPro image usually has these already; only download what's missing. devkitPro's package
        # server sometimes refuses requests from CI (HTTP 403), so try a few times before failing.
        run: |
          PKGS="wut wut-tools wiiu-curl wiiu-sdl2 wiiu-sdl2_ttf wiiu-sdl2_mixer wiiu-sdl2_image"
          if dkp-pacman -Q $PKGS; then echo "All libraries are in the image already"; exit 0; fi
          for i in 1 2 3 4 5; do
            dkp-pacman -Sy --noconfirm --needed $PKGS && exit 0
            echo "Package download failed, retrying in 30 s ($i/5)"
            sleep 30
          done
          exit 1
      - name: Restore libmocha (pinned, so it never needs rebuilding)
        id: mocha
        uses: actions/cache@v4
        with:
          path: |
            /opt/devkitpro/wut/usr/lib/libmocha.a
            /opt/devkitpro/wut/usr/include/mocha
          key: libmocha-${{ env.LIBMOCHA_COMMIT }}
      - name: Build libmocha (USB drive access)
        if: steps.mocha.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/wiiu-env/libmocha.git /tmp/libmocha
          git -C /tmp/libmocha checkout $LIBMOCHA_COMMIT
          make -C /tmp/libmocha -j"$(nproc)" install
      - name: Build
        run: make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: wiidrop
          path: |
            wiidrop.wuhb
            wiidrop.rpx
